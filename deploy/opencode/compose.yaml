# KiroCrew + OpenCode appliance.
#
#   cp .env.example .env      # fill the values
#   docker compose up -d --build
#   docker compose exec kirocrew kirocrew token --ttl 2h
#
# The whole home (gateway state, WhatsApp session, archives, skills, OpenCode
# sessions) lives in the named volume. Rebuilding or pulling a newer image
# keeps it.

name: kirocrew-opencode

services:
  kirocrew:
    image: ${KIROCREW_IMAGE:-kirocrew-opencode:local}
    build:
      context: ../..
      dockerfile: deploy/opencode/Dockerfile
      args:
        PYTHON_BASE: ${KIROCREW_PYTHON_BASE:-python:3.12-slim-trixie}
        KIROCREW_VERSION: ${KIROCREW_VERSION:-dev}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.4}
        OPENCODE_SHA512_X64: ${OPENCODE_SHA512_X64:-ad66e708e3ff9c837c20b02dd2172ec39d6c35bb97fb3708992097eed3d40ac69881534b719ef7c217d6e2561cd3864c3e1c5ec92a2837422f7cbbe7b1a25f81}
        OPENCODE_SHA512_ARM64: ${OPENCODE_SHA512_ARM64:-306c2b77238b27660c84097d93f253a632c7a7cc82ab0ea0a83293d0630e80fbb9ea830e65268c51483c8492b716adbbb8638540b894b40dec6e175083794500}
    container_name: ${KIROCREW_CONTAINER_NAME:-kirocrew-opencode}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # The gateway binds the same port inside the container that the public
      # dashboard URL names; publishing host:host keeps the healthcheck and the
      # browser link on one number.
      - "${KIROCREW_BIND_HOST:-127.0.0.1}:${KIROCREW_PORT:-5476}:${KIROCREW_PORT:-5476}"
    volumes:
      - kirocrew-home:/home/kirocrew
    environment:
      # Channel + model credentials. The seed stores the OpenRouter key in the
      # gateway .env and the OpenCode auth store, then removes it from the
      # long-lived process environment; the official entrypoint does the same
      # for the channel tokens.
      KIROCREW_PORT: ${KIROCREW_PORT:-5476}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_VISION_MODEL: ${OPENROUTER_VISION_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      # Every KiroCrew channel, empty by default. Fill the ones you use.
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      KIROCREW_OWNER_ID: ${KIROCREW_OWNER_ID:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      KIROCREW_ENABLE_TELEGRAM: ${KIROCREW_ENABLE_TELEGRAM:-}
      WECOM_BOT_ID: ${WECOM_BOT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WEBEX_BOT_TOKEN: ${WEBEX_BOT_TOKEN:-}
      WEIXIN_TOKEN: ${WEIXIN_TOKEN:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      MICROSOFT_APP_ID: ${MICROSOFT_APP_ID:-}
      MICROSOFT_APP_PASSWORD: ${MICROSOFT_APP_PASSWORD:-}
      MICROSOFT_APP_TENANT_ID: ${MICROSOFT_APP_TENANT_ID:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      AZURE_DEVOPS_EXT_PAT: ${AZURE_DEVOPS_EXT_PAT:-}
      BITBUCKET_EMAIL: ${BITBUCKET_EMAIL:-}
      BITBUCKET_API_TOKEN: ${BITBUCKET_API_TOKEN:-}
      KIRO_API_KEY: ${KIRO_API_KEY:-}
      # Stack defaults. Every one can be overridden per deployment.
      KIROCREW_MODEL: ${KIROCREW_MODEL:-openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}
      KIROCREW_REASONING_EFFORT: ${KIROCREW_REASONING_EFFORT:-high}
      KIROCREW_FALLBACK_MODEL: ${KIROCREW_FALLBACK_MODEL:-openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}
      KIROCREW_ENABLE_WHATSAPP: ${KIROCREW_ENABLE_WHATSAPP:-1}
      WHATSAPP_ALLOWED_WA_IDS: ${WHATSAPP_ALLOWED_WA_IDS:-}
      KIROCREW_STT_PROVIDER: ${KIROCREW_STT_PROVIDER:-local}
      KIROCREW_STT_MODEL: ${KIROCREW_STT_MODEL:-small}
      KIROCREW_STT_LANGUAGE: ${KIROCREW_STT_LANGUAGE:-it}
      KIROCREW_PUBLIC_URL: ${KIROCREW_PUBLIC_URL:-}
      KIROCREW_SKIP_ONBOARDING: ${KIROCREW_SKIP_ONBOARDING:-1}
      KIROCREW_YOLO: ${KIROCREW_YOLO:-1}
      KIROCREW_APPROVAL_MODE: ${KIROCREW_APPROVAL_MODE:-auto}
      KIROCREW_ALLOW_UNSANDBOXED: ${KIROCREW_ALLOW_UNSANDBOXED:-1}
      KIROCREW_PRESERVE_AGENT_MODEL: ${KIROCREW_PRESERVE_AGENT_MODEL:-}
      TZ: ${TZ:-Europe/Rome}
    # Permit the inner user-namespace sandbox. If the runtime still refuses it,
    # KIROCREW_ALLOW_UNSANDBOXED=1 makes the container the isolation boundary.
    security_opt:
      - seccomp:./seccomp.json
      # Grants only `userns,` so the inner KiroCrew sandbox can build its mount
      # namespace. Install once on the host with scripts/install-host.sh.
      - apparmor=kirocrew-container
    # The image's HEALTHCHECK covers liveness. Override the port only if needed.

volumes:
  kirocrew-home:
